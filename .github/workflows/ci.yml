name: ci

on:
  # Documentation-only changes do not run the suite. The devlog is written after almost every
  # batch, and a run costs eight minutes of e2e to prove that prose still compiles. A commit
  # that touches anything else runs everything: GitHub skips a run only when *every* changed
  # file matches, so "docs and code" is code.
  #
  # Nothing under test reads these files — the tests that name them do so in comments.
  push:
    paths-ignore: &docs
      - "logs/**"
      - "**/*.md"
      - ".env.example"
  pull_request:
    paths-ignore: *docs

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: autora
          POSTGRES_PASSWORD: autora
          POSTGRES_DB: autora
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U autora -d autora"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://autora:autora@localhost:5434/autora
      AUTORA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -e "backend[dev]"
      - name: Lint (ruff + import boundaries)
        run: make lint-py
      - name: Migrations apply and match models
        run: make migrate && make db-check
      - name: Generated event schema is up to date
        run: make gen-schema-check
      - name: OpenAPI document for the web client is up to date
        run: make gen-api-check
      - name: Tests (DB tests run against a real Postgres; none may be skipped)
        run: .venv/bin/pytest backend -q -rs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types match the committed OpenAPI document
        run: pnpm -F web gen-api:check
      - name: 3D assets are valid glTF, within budget, and licensed (LICENSES.md)
        run: pnpm -F web check-assets

  e2e:
    # Phase 3 acceptance (T-315): real API, worker and web app in a browser.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: autora
          POSTGRES_PASSWORD: autora
          POSTGRES_DB: autora
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U autora -d autora"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://autora:autora@localhost:5434/autora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -e "backend[dev]"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser comes from Playwright's CDN (kept between runs); only its system packages come
      # from apt, which has failed for hours at a time on the runner (security.ubuntu.com not
      # resolving). Those are retried, and if apt stays down the image's own Chrome libraries are
      # used: a browser that cannot start fails the tests below, so nothing is hidden.
      - id: playwright
        run: echo "version=$(pnpm -F web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm -F web exec playwright install chromium
      - name: Browser system packages (retried; apt may be down)
        run: |
          for attempt in 1 2; do
            if timeout 480 pnpm -F web exec playwright install-deps chromium; then exit 0; fi
            echo "::warning::playwright install-deps failed (attempt $attempt)"
            sleep $((attempt * 30))
          done
          echo "::warning::apt unavailable; using the runner image's libraries"
      - name: Browser end-to-end tests (two tabs, API restart)
        run: pnpm -F web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/web/test-results/
