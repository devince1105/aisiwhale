name: autora

services:
  db:
    # Postgres 18, as on Neon (D-152); the pg16 volume (autora-db-data) is kept as a backup
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: autora
      POSTGRES_PASSWORD: autora
      POSTGRES_DB: autora
    ports:
      - "${AUTORA_DB_PORT:-5434}:5432"
    volumes:
      # 18's image keeps its data under /var/lib/postgresql/18/docker: mount the parent
      - autora-db-data-18:/var/lib/postgresql
    # tini as PID 1 reaps orphans: without it a timed-out healthcheck's orphaned pg_isready
    # is reparented to the postmaster, whose "untracked child ... exit code 2" restarts
    # every server process and drops all connections (seen three times on 2026-10-06)
    init: true
    healthcheck:
      # exec form: no shell between Docker and pg_isready
      test: ["CMD", "pg_isready", "-U", "autora", "-d", "autora"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://autora:autora@db:5432/autora
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - autora-blobs:/app/data/blobs   # step blobs written by the worker, served by the API
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://autora:autora@db:5432/autora
    env_file:
      - ../.env
    volumes:
      - autora-blobs:/app/data/blobs
    stop_grace_period: 40s   # SIGTERM lets in-flight runs finish (worker grace: 30s)
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        SITE_OPERATOR: ${SITE_OPERATOR:-}
        SITE_OPERATOR_OWNER: ${SITE_OPERATOR_OWNER:-}
        SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
        SITE_CONTACT_PHONE: ${SITE_CONTACT_PHONE:-}
        SITE_MEMBERSHIP_OPEN: ${SITE_MEMBERSHIP_OPEN:-false}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # the public site is rendered on the server, which reaches the API inside the network
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  autora-db-data:      # Postgres 16 (until D-152): kept, not mounted
  autora-db-data-18:
  autora-blobs:
